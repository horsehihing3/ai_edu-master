spring:
  application:
    name: edu-platform
  datasource:
    url: jdbc:mysql://211.171.152.242:3310/edu_platform?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  # OAuth2 소셜 로그인 - Client ID 발급 후 아래 주석 해제
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         kakao:
  #           client-id: ${KAKAO_CLIENT_ID:}
  #           client-secret: ${KAKAO_CLIENT_SECRET:}
  #         naver:
  #           client-id: ${NAVER_CLIENT_ID:}
  #           client-secret: ${NAVER_CLIENT_SECRET:}

server:
  port: 7000
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:edu-platform-jwt-secret-key-must-be-at-least-256-bits-long}
  access-token-expiry: 3600000     # 1시간
  refresh-token-expiry: 604800000  # 7일

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:edu-platform-bucket}
    region: ${AWS_REGION:ap-northeast-2}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:}

app:
  upload:
    path: ${UPLOAD_PATH:uploads}

cors:
  allowed-origins: http://localhost:7001,http://localhost:3000,http://211.171.152.242:7001,http://edu.com4in.com,https://edu.com4in.com,http://edu.com4in.com:7001,https://edu.com4in.com:7001

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.edu.platform.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


logging:
  level:
    com.edu.platform: DEBUG
    org.springframework.security: INFO
