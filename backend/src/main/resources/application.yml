spring:
  application:
    name: edu-platform
  autoconfigure:
    exclude: io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  datasource:
    url: jdbc:mysql://211.171.152.242:3310/edu_platform?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  # [2026-04-04] OAuth2 소셜 로그인 — Kakao/Google
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 7000
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:edu-platform-jwt-secret-key-must-be-at-least-256-bits-long}
  access-token-expiry: 3600000     # 1시간
  refresh-token-expiry: 604800000  # 7일

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:edu-platform-bucket}
    region: ${AWS_REGION:ap-northeast-2}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:}

app:
  upload:
    path: ${UPLOAD_PATH:uploads}
  base-url: ${APP_BASE_URL:http://dev.edu-platform.com:7001}
  mail:
    from: ${MAIL_FROM:noreply@example.com}
    reset-token-expiry-minutes: 30

cors:
  allowed-origins: http://localhost:7001,http://localhost:3000,http://211.171.152.242:7001,http://edu.com4in.com,https://edu.com4in.com,http://edu.com4in.com:7001,https://edu.com4in.com:7001

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.edu.platform.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


logging:
  level:
    com.edu.platform: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/app.log

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ap-northeast-2
    s3:
      bucket: ai-edu-bucket

